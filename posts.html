<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>From Toby</title>

<link rel="icon" type="image/png" sizes="40x40" href="./tab-icon.png">
<link rel="apple-touch-icon" href="./tab-icon.png">

<style>
@font-face {
    font-family: "Determination Mono";
    src: url("./DeterminationMono.ttf") format("truetype");
}

html,
body {
    margin: 0;
    background: black;
    color: white;
    font-family: "Determination Mono", monospace;
}

body {
    padding: 30px;
    box-sizing: border-box;
}

/* Page title */
#title {
    text-align: center;
    font-size: 48px;
    margin-bottom: 30px;
}

/* Post */
.post {
    max-width: 700px;
    margin: 0 auto 25px auto;

    border: 6px solid white;
    padding: 20px;

    box-sizing: border-box;
}

/* Post date */
.date {
    font-size: 20px;
    margin-bottom: 15px;
    opacity: 0.7;
}

/* Post text */
.postText {
    font-size: 28px;
    line-height: 1.4;

    white-space: pre-wrap;
}

/* Back button */
#back {
    display: block;

    width: fit-content;
    margin: 30px auto 0 auto;

    color: white;
    text-decoration: none;

    font-size: 24px;
}

#back:hover {
    text-decoration: underline;
}

/* Post image */
.postImage {
    width: 100%;
    height: auto;

    margin-top: 15px;

    image-rendering: auto;
}

/* Post links */
.postText a {
    color: white;
    text-decoration: underline;
}

.postText a:visited {
    color: white;
}

.postText a:hover {
    opacity: 0.7;
}
</style>
</head>

<body>

<div id="title">
    From Toby
</div>


<!-- POST #1 -->
<div class="post">

    <div class="date">
        9:52 PM - OCT 5 2026
    </div>

    <div class="postText">
<img class="postImage" src="./queen.jpg" alt="">
        
    </div>

</div>


<!-- POST #2 -->
<div class="post">

    <div class="date">
        6:40 PM - OCT 5 2026
    </div>

    <div class="postText">

It was nice to meet all the judges of the Japan Game Awards Game Designers Award one last time. Thank you, Sakurai!

    <img class="postImage" src="./gathering.jpeg" alt="">

</div>

</div>


<!-- POST #3 -->
<div class="post">

    <div class="date">
        5:26 PM - SEP 27 2026
    </div>

    <div class="postText">
Can @tuyoki.bsky.social draw this sprite please

        <img class="postImage" src="./temmiedrawsprite.webp" alt="pluey putting object on very low table by kneading paws (object is not seen)">
        
    </div>

</div>


<!-- Back to main page -->
<a id="back" href="index.html">
    &lt; Back
</a>

</body>
</html>
