<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>HOW MUCH LONGER NOW?</title>

<link rel="icon" type="image/png" sizes="40x40" href="./tab-icon.png">
<link rel="apple-touch-icon" href="./tab-icon.png">

<style>
@font-face {
    font-family: "Determination Mono";
    src: url("./DeterminationMono.ttf") format("truetype");
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: black;
    color: white;
    overflow: auto;
}

body {
    font-family: "Determination Mono", monospace;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* Bottom dialogue box */
#textbox {
    display: none;

    position: absolute;

    left: 32px;
    right: 32px;
    bottom: 32px;

    height: 180px;

    background: black;
    border: 8px solid white;

    box-sizing: border-box;
    padding: 24px;

    font-size: 32px;
    line-height: 1.4;
}

#text {
    white-space: pre-wrap;
}

/* Center title */
#centerText {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 64px;
    text-align: center;
    white-space: pre-line;
}

/* Countdown */
#countdown {
    font-size: 32px;
    margin-top: 10px;
}

/* Bottom links */
#bottomLinks {
    position: absolute;

    left: 50%;
    bottom: 5px;

    transform: translateX(-50%);

    display: flex;
    gap: 40px;

    font-size: 24px;
}

#bottomLinks a {
    color: white;
    text-decoration: none;
}

#bottomLinks a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div id="game">

    <!-- Bottom dialogue box -->
    <div id="textbox">
        <span id="text"></span>
    </div>

    <!-- Centered title -->
    <div id="centerText">
        DELTARUNE Chapter 6<br>
        <span id="year">2027</span>
        <div id="countdown"></div>
    </div>

    <!-- Bottom links -->
    <div id="bottomLinks">

        <a href="posts.html">
            From Toby
        </a>

        <a href="https://toby.fangamer.com/newsletters/summer26/" target="_blank" rel="noopener noreferrer">
            Latest Newsletter
        </a>

    </div>

</div>

<script>

/* Dialogue messages */
const messages = [

`HOW MUCH LONGER NOW?

MY DELTARUNE.`,

`WHETHER 11 HOURS OR 11 YEARS,

DELTARUNE WILL BE WAITING.`,

`DELTARUNE

TOMORROW`

];

const message =
messages[Math.floor(Math.random() * messages.length)];


/* Page elements */
const textElement = document.getElementById("text");
const textbox = document.getElementById("textbox");


/* Sound pool */
const soundPool = [];

const soundCount = 8;

for (let i = 0; i < soundCount; i++) {

    const sound = new Audio("./snd_text.wav");

    sound.preload = "auto";

    soundPool.push(sound);
}

let soundIndex = 0;


/* Play text sound */
function playTextSound() {

    const sound = soundPool[soundIndex];

    sound.currentTime = 0;
    sound.play().catch(() => {});

    soundIndex++;

    if (soundIndex >= soundPool.length) {
        soundIndex = 0;
    }
}


/* Typing */
let i = 0;
let started = false;
let finishedTyping = false;


function typeText() {

    if (i < message.length) {

        const character = message.charAt(i);

        textElement.textContent += character;

        playTextSound();

        i++;

        setTimeout(typeText, 35);

    } else {

        finishedTyping = true;
    }
}


/* Click handling */
document.addEventListener("click", function(event) {

    /* Don't trigger the dialogue when clicking a bottom link */
    if (event.target.closest("#bottomLinks")) {
        return;
    }

    if (!started) {

        started = true;

        textbox.style.display = "block";

        typeText();

        return;
    }

    if (finishedTyping) {

        textbox.style.display = "none";
    }

});


/* Countdown */
const countdown =
document.getElementById("countdown");

const targetDate =
new Date("January 1, 2027 00:00:00");


function updateCountdown() {

    const now = new Date();

    const difference =
    targetDate - now;

    if (difference <= 0) {

        countdown.textContent = "2027";

        return;
    }

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (difference / 1000) % 60
    );

    countdown.textContent =
        `${days}D ${hours}H ${minutes}M ${seconds}S`;
}

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
